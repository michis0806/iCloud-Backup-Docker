version: "3.8"

services:
  icloud-backup:
    build: .
    container_name: icloud-backup
    init: true
    restart: unless-stopped
    mem_limit: 512m
    # cpus: 1.0  # Requires kernel CFS scheduler support (not available on all Synology models)
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ${CONFIG_PATH:-./config}:/config
      - ${ARCHIVE_PATH:-./archive}:/archive
      # Netzwerkfreigaben (SMB/NFS): Freigabe dauerhaft auf dem Host mounten
      # (kein x-systemd.automount/idle-timeout) und mit rslave einbinden,
      # damit ein Remount auf dem Host im laufenden Container ankommt:
      # - type: bind
      #   source: /mnt/share/icloud_backup
      #   target: /backups
      #   bind:
      #     propagation: rslave
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Benachrichtigungen (Pushover) werden in der Web-Oberfläche unter
      # "Einstellungen" konfiguriert und in /config/config.yaml gespeichert.
      # - AUTH_PASSWORD=mein-sicheres-passwort  # If not set, a random password is logged on startup
      # - SECRET_KEY=...  # Optional; falls back to AUTH_PASSWORD if not set
      # - ICLOUD_SECRET_KEY=...  # Optional; Schlüssel für optional gespeicherte iCloud-Passwörter (Fallback: SECRET_KEY, AUTH_PASSWORD)
