name: Build and Push Docker Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: michis0806/icloud-backup-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build date
        id: builddate
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build test image (amd64, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke-test
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.builddate.outputs.value }}
          cache-from: type=gha

      - name: Smoke test
        run: |
          set -uo pipefail
          cleanup() { docker rm -f smoke-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name smoke-test -p 8080:8080 \
            "${IMAGE_NAME}:smoke-test"

          for _ in $(seq 1 30); do
            if curl -fs --max-time 5 http://localhost:8080/health -o health.json; then
              echo "Health endpoint responded:"
              cat health.json
              echo
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=smoke-test)" ]; then
              echo "::error::Container exited during startup"
              docker logs smoke-test
              exit 1
            fi
            sleep 2
          done

          echo "::error::/health did not respond within 60s"
          docker logs smoke-test
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.builddate.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Hub README with changelog
        run: |
          {
            cat DOCKERHUB.md
            echo ""
            echo "---"
            echo ""
            # Extract the two most recent version sections (or Unreleased)
            # from CHANGELOG.md and append them to the Docker Hub description
            awk '
              /^## \[/ { count++; if (count > 2) exit }
              count >= 1 { print }
            ' CHANGELOG.md
            echo ""
            echo "> [Full Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > DOCKERHUB_FULL.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKERHUB_FULL.md
