name: Check pyicloud Updates

# Prepares a reviewable PR for new pyicloud versions. It never releases anything:
# requirements.txt pins pyicloud exactly on purpose, because the 2FA adapter
# (app/services/apple_auth.py) relies on internal pyicloud interfaces (see AGENTS.md).
# Note: PRs created with GITHUB_TOKEN do not trigger other workflows, so this
# workflow runs the test suite itself and reports the result in the PR body.

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PACKAGE_NAME: pyicloud

jobs:
  prepare-upgrade-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get latest pyicloud version from PyPI
        id: pypi
        run: |
          LATEST=$(curl -sf https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/json | jq -r '.info.version')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to fetch latest version from PyPI"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest pyicloud on PyPI: $LATEST"

      - name: Restore cached version
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .pyicloud-version
          key: pyicloud-version-${{ steps.pypi.outputs.version }}
          restore-keys: |
            pyicloud-version-

      - name: Read cached version
        id: cached
        run: |
          if [ -f .pyicloud-version ]; then
            CACHED=$(cat .pyicloud-version)
          else
            CACHED=""
          fi
          echo "version=$CACHED" >> "$GITHUB_OUTPUT"
          echo "Cached pyicloud version: ${CACHED:-<none>}"

      - name: Compare versions
        id: compare
        env:
          PYPI_VERSION: ${{ steps.pypi.outputs.version }}
          CACHED_VERSION: ${{ steps.cached.outputs.version }}
        run: |
          LATEST="$PYPI_VERSION"
          CACHED="$CACHED_VERSION"
          if [ "$LATEST" = "$CACHED" ]; then
            echo "pyicloud $LATEST is already built – skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New pyicloud version detected: $CACHED -> $LATEST"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.compare.outputs.changed == 'true'
        uses: actions/checkout@v5

      - name: Check for an existing PR
        if: steps.compare.outputs.changed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          BRANCH="deps/pyicloud-${VERSION}"
          # Only an open PR counts as handled. A branch left over from a run whose
          # PR creation failed is overwritten (force push) and the PR retried.
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" != "0" ]; then
            echo "Open PR for $BRANCH already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and update pin
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          git checkout -b "deps/pyicloud-${VERSION}"
          # Matches pyicloud==..., >=, ~=, <= forms; trailing comments are kept.
          sed -i -E "s/^pyicloud[[:space:]]*(==|>=|<=|~=)[^#[:space:]]*/pyicloud==${VERSION}/" requirements.txt
          if ! grep -qE "^pyicloud==${VERSION}( |#|$)" requirements.txt; then
            echo "Failed to update pyicloud pin in requirements.txt"
            exit 1
          fi
          git diff requirements.txt

      - name: Set up Python
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        id: tests
        run: |
          # A failing install or test run must not stop the workflow: the PR is created either way.
          set +e
          {
            python -m pip install -r requirements.txt -r requirements-dev.txt &&
            python -m pytest -q
          } > "$RUNNER_TEMP/test-output.txt" 2>&1
          STATUS=$?
          tail -n 40 "$RUNNER_TEMP/test-output.txt" > "$RUNNER_TEMP/test-tail.txt"
          cat "$RUNNER_TEMP/test-tail.txt"
          if [ "$STATUS" -eq 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit, push and open PR
        if: steps.compare.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pypi.outputs.version }}
          TEST_RESULT: ${{ steps.tests.outputs.result }}
        run: |
          BRANCH="deps/pyicloud-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          git commit -m "Bump pyicloud to ${VERSION}"
          git push --force origin "$BRANCH"

          if [ "$TEST_RESULT" = "passed" ]; then
            RESULT_LINE="Tests: **passed**"
          else
            RESULT_LINE="Tests: **FAILED** (or dependency installation failed)"
          fi
          FENCE='```'
          {
            echo "Automated pyicloud upgrade to ${VERSION}."
            echo
            echo "Upstream release notes: https://github.com/timlaing/pyicloud/releases/tag/${VERSION}"
            echo
            echo "## Test result"
            echo
            echo "$RESULT_LINE"
            echo
            echo "Last lines of \`python -m pytest -q\`:"
            echo
            echo "$FENCE"
            cat "$RUNNER_TEMP/test-tail.txt"
            echo "$FENCE"
            echo
            echo "## Review checklist (see AGENTS.md)"
            echo
            echo "- [ ] Verify the 2FA adapter (\`app/services/apple_auth.py\`) against the new pyicloud internals"
            echo "- [ ] Run a live reauth against a real Apple account"
            echo "- [ ] Update CHANGELOG.md"
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Bump pyicloud to ${VERSION}" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Save version to cache
        if: steps.compare.outputs.changed == 'true' && (steps.existing.outputs.exists == 'true' || steps.pr.outcome == 'success')
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
        run: echo "$VERSION" > .pyicloud-version

      - name: Update cache
        if: steps.compare.outputs.changed == 'true' && (steps.existing.outputs.exists == 'true' || steps.pr.outcome == 'success')
        uses: actions/cache/save@v5
        with:
          path: .pyicloud-version
          key: pyicloud-version-${{ steps.pypi.outputs.version }}
